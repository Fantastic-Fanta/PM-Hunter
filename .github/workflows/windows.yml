# Builds Hunt for Windows (it has to be built on Windows): the hunter,
# hunt-engine.exe, with PyInstaller (windows/hunt.spec), and the window,
# Hunt.exe, with Rust (window/), packed into PoopihuntSetup.exe with Inno Setup
# (windows/hunt.iss). publish-windows.sh starts it with a build number and
# puts the result on poopihunt.xyz; a push builds it too, as a check, without
# the debug channel.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build number (publish-windows.sh fills it in; higher is newer)"
        default: "0"
      name:
        description: "Build name, as the window shows it"
        default: "test"
  push:
    branches: [main]
    paths: ["*.py", "requirements.txt", "config.example.json", "samples/**", "windows/**", "window/**",
            ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip  # (the packages' downloads kept between builds)
          cache-dependency-path: requirements.txt

      - name: Packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3

      - name: Build number and the debug channel
        shell: python
        env:
          VERSION: ${{ inputs.version || '0' }}
          NAME: ${{ inputs.name || 'test' }}
          # only published builds report to the debug channel
          HOOK: ${{ github.event_name == 'workflow_dispatch' && secrets.WINDOWS_DEBUG_WEBHOOK || '' }}
        run: |
          import os
          with open("build_info.py", "w") as f:
              f.write(f"VERSION = {int(os.environ['VERSION'])}\nNAME = {os.environ['NAME']!r}\n")
          if os.environ["HOOK"]:
              with open("debuglog.py") as f:
                  p = f.read()
              with open("debuglog.py", "w") as f:
                  f.write(p.replace("__WINDOWS_DEBUG_WEBHOOK__", os.environ["HOOK"]))
          print("build", os.environ["VERSION"], os.environ["NAME"],
                "with" if os.environ["HOOK"] else "without", "the debug channel")

      - name: hunt-engine.exe
        run: pyinstaller --noconfirm --clean windows/hunt.spec

      # Hunt.exe is the same from build to build (its number is in build.json): the last
      # one is used again while window/ is unchanged, built (a minute or so) when it isn't
      - name: Hunt.exe, from a build with this window/
        id: window
        uses: actions/cache@v6
        with:
          path: window/target/release/Hunt.exe
          key: hunt-exe-${{ hashFiles('window/**', 'windows/hunt.ico') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.window.outputs.cache-hit != 'true'
        with:
          workspaces: window

      - name: Hunt.exe
        env:
          VERSION: ${{ inputs.version || '0' }}
          NAME: ${{ inputs.name || 'test' }}
        run: |
          if (Test-Path window\target\release\Hunt.exe) { "Hunt.exe from a build with this window/" }
          else {
            cargo build --release --locked --manifest-path window/Cargo.toml
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Copy-Item window\target\release\Hunt.exe dist\Hunt\Hunt.exe
          @{ version = [long]$env:VERSION; name = $env:NAME } | ConvertTo-Json -Compress | Set-Content dist\Hunt\build.json -Encoding ascii
          "{0:N1} MB Hunt.exe" -f ((Get-Item dist\Hunt\Hunt.exe).Length / 1MB)
          Get-Content dist\Hunt\build.json

      - name: Read the samples with Windows' OCR
        continue-on-error: true
        env:
          HUNT_DEBUG: "0"
          HUNT_DATA: ${{ runner.temp }}\hunt
        run: dist\Hunt\hunt-engine.exe --diagnose --config config.example.json

      - name: Hunt.exe's window comes up
        env:
          HUNT_DATA: ${{ runner.temp }}\pill
          HUNT_CAPTURABLE: "1"  # it hides from screenshots otherwise (the hunter's too)
        run: |
          New-Item -ItemType Directory -Force $env:HUNT_DATA | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Picture($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:HUNT_DATA\$name.png")
          }
          Start-Process dist\Hunt\Hunt.exe -ArgumentList "--smoke", "--intro"
          Start-Sleep -Seconds 1.2; Picture "opening"  # the big Clodsire on its way (on OpenGL; none here)
          Start-Sleep -Seconds 1.8; Picture "screen"   # the pill
          # (it may have started again on Direct3D, as another process: smoke.txt says when it's done)
          for ($i = 0; $i -lt 40 -and -not (Test-Path "$env:HUNT_DATA\smoke.txt"); $i++) { Start-Sleep -Milliseconds 500 }
          Get-Content "$env:HUNT_DATA\hunt.log" -ErrorAction SilentlyContinue | Select-String "window"
          $smoke = Get-Content "$env:HUNT_DATA\smoke.txt" -ErrorAction SilentlyContinue
          $smoke
          if ("$smoke" -notmatch "^ok:") { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: pill
          path: ${{ runner.temp }}/pill/*.png
          retention-days: 3

      - name: PoopihuntSetup.exe
        env:
          NAME: ${{ inputs.name || 'test' }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DName=$env:NAME" windows\hunt.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "{0:N1} MB installed, {1:N1} MB setup" -f ((Get-ChildItem dist\Hunt -Recurse | Measure-Object Length -Sum).Sum / 1MB),
            ((Get-Item dist\PoopihuntSetup.exe).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: PoopihuntSetup
          path: dist/PoopihuntSetup.exe
          if-no-files-found: error
          retention-days: 14
