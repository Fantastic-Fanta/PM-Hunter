[package]
name = "hunt"
version = "2.0.0"
description = "Hunt for Mac and Windows: the pill (start / stop, the website code, the webhook) with the hunter in it"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "Hunt"
path = "src/main.rs"

[dependencies]
hunt-core = { path = "../core" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_extras = { version = "=0.31.1", default-features = false, features = ["svg", "image"] }  # the icons (icons/)
image.workspace = true  # Clodsire, opening
raw-window-handle = "0.6"  # the window's handle: hidden from screenshots (Windows), no shadow (a Mac)
serde_json.workspace = true
sha2 = "0.10"
ureq.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSArray", "NSDictionary", "NSString", "NSGeometry", "NSObject"] }
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }  # Direct3D, for egui's wgpu
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security",
    "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Console"] }
# the hunter's eyes and hands: the screen (GDI), the mouse and keyboard (SendInput), Windows' text recognition
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging",
    "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_System_WinRT",
    "Win32_System_SystemInformation"] }

[build-dependencies]
winresource = "0.1"
