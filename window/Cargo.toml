[package]
name = "hunt"
version = "1.0.0"
edition = "2021"
description = "Hunt's window: a pill with no frame that runs the hunter (hunt-engine.exe)"
publish = false

[[bin]]
name = "Hunt"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_extras = { version = "=0.31.1", default-features = false, features = ["svg", "image"] }  # the icons (icons/)
image = { version = "0.25", default-features = false, features = ["png"] }  # Clodsire, opening
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"  # the window's handle, to hide it from screenshots
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }  # Direct3D, for egui's wgpu
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security",
    "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
