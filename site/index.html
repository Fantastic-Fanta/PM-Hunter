<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>POOPIHUNT</title>
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<style>
  /* the battle page's look (app/index.html): a Gen 3 screen of 240 x 160 pixels, zoomed to fit.
     site/fill_page.py fills in the builds and their file names. */
  @font-face { font-family: "Gen3"; src: url(/app/fonts/gen3.woff2) format("woff2"); font-display: block; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; min-height: 100dvh;
         overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #app { position: relative; width: 240px; height: 160px; overflow: hidden; font: 16px/16px "Gen3", monospace;
         -webkit-font-smoothing: none; }
  .bg { position: absolute; inset: 0 0 48px 0; background: repeating-linear-gradient(180deg, #deffd5 0 1px, #d5f6d5 1px 4px); }
  .bg::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 16px;
                background: linear-gradient(180deg, #deffd5 0 1px, #b4e694 1px 4px, #deffd5 4px 5px, #bdeea4 5px 8px,
                                            #deffd5 8px 9px, #c5eebd 9px 12px, #deffd5 12px 13px, #cdf6c5 13px 16px); }
  .win { position: absolute; left: 24px; top: 10px; width: 192px; height: 96px; background: #fff; border-radius: 3px;
         color: #484858; text-shadow: 1px 0 #d0d0c8, 0 1px #d0d0c8, 1px 1px #d0d0c8;
         box-shadow: inset 0 0 0 1px #4a4152, inset 0 0 0 2px #293131, inset 0 0 0 3px #6a8bbd,
                     inset 0 0 0 5px #6a5a73, inset 0 0 0 6px #ded5de; }
  h1 { margin: 0; position: absolute; left: 0; right: 0; top: 9px; text-align: center; font: inherit; color: #e05040;
       text-shadow: 1px 0 #f8c8a8, 0 1px #f8c8a8, 1px 1px #f8c8a8; }
  a { position: absolute; left: 16px; height: 16px; color: inherit; text-decoration: none; white-space: nowrap; }
  a i { position: absolute; left: -9px; top: 4px; width: 5px; height: 7px; visibility: hidden;
        background: #484858; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  a.on i { visibility: visible; }
  .msgbox { position: absolute; left: 0; top: 112px; width: 240px; height: 48px; background: #4a4152; }
  .msgframe { position: absolute; left: 1px; top: 3px; width: 238px; height: 42px; background: #6aa4a4;
              border: solid #d54a39; border-width: 1px 6px; border-radius: 5px; box-shadow: inset 0 0 0 1px #838b8b; }
  .msgtext { position: absolute; left: 9px; top: 6px; right: 9px; white-space: pre-line; color: #fff;
             text-shadow: 1px 0 #6a5a73, 0 1px #6a5a73, 1px 1px #6a5a73; }
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>
  <div class="win">
    <h1>POOPIHUNT</h1>
    <a href="APKFILE" download data-os="android" data-say="For your phone: Android 11
or newer. Build BUILD."><i></i>DOWNLOAD FOR ANDROID</a>
    <a href="WINDOWS_FILE" download data-os="windows" data-say="For your PC: Windows 10 or 11.
Build WINDOWS_BUILD."><i></i>DOWNLOAD FOR WINDOWS</a>
    <a href="MAC_FILE" download data-os="mac" data-say="For your Mac: macOS 11+.
Build MAC_BUILD."><i></i>DOWNLOAD FOR MAC</a>
    <a href="/app/" data-say="Watch and battle from
this browser."><i></i>PLAY ON THE WEB</a>
    <a href="#" id="more" data-say="Hunt for the other kinds
of phones and computers."><i></i>OTHER DOWNLOADS</a>
  </div>
  <div class="msgbox"><div class="msgframe"><div class="msgtext" id="say"></div></div></div>
</div>
<script>
"use strict";
// zoomed to fit; the ▶ follows the mouse or the arrow keys, Enter / Z chooses.
// The download for this browser's system only (an Android phone, a PC, a Mac),
// the others under OTHER DOWNLOADS.
const app = document.getElementById("app"), every = [...document.querySelectorAll(".win a")];
const ua = navigator.userAgent, touch = navigator.maxTouchPoints > 1;
const os = /Android/i.test(ua) ? "android"
  : /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && touch) ? "ios"  // (an iPad says Macintosh)
  : /Windows/.test(ua) ? "windows" : /Macintosh|Mac OS X/.test(ua) ? "mac" : "";
const more = document.getElementById("more");
let links = [], all = false;
function layout() {
  const downloads = every.filter(a => a.dataset.os), mine = downloads.filter(a => a.dataset.os === os);
  const others = downloads.length > mine.length;
  links = all ? [...downloads, every.find(a => a.getAttribute("href") === "/app/")]
              : [...mine, every.find(a => a.getAttribute("href") === "/app/"), ...(others ? [more] : [])];
  const step = links.length > 3 ? 16 : 18, top = links.length > 3 ? 26 : 32;  // (four fit inside the frame)
  every.forEach(a => { a.style.display = links.includes(a) ? "" : "none"; });
  links.forEach((a, i) => { a.style.top = top + step * i + "px"; });
}
more.addEventListener("click", e => { e.preventDefault(); all = true; layout(); point(0); });
layout();
function fit() {
  const k = Math.min(innerWidth / 240, innerHeight / 160);
  app.style.zoom = k >= 2 ? Math.floor(k * 4) / 4 : k;
}
addEventListener("resize", fit);
fit();
let cur = 0, typing = 0;
function point(i) {
  cur = i;
  every.forEach(a => a.classList.toggle("on", a === links[i]));
  const text = links[i].dataset.say, el = document.getElementById("say");
  clearInterval(typing);
  let n = 0;
  typing = setInterval(() => { el.textContent = text.slice(0, ++n); if (n >= text.length) clearInterval(typing); }, 28);
}
every.forEach(a => a.addEventListener("pointerenter", () => { const i = links.indexOf(a); if (i >= 0 && cur !== i) point(i); }));
addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); point((cur + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length); }
  else if (e.key === "Enter" || e.key.toLowerCase() === "z") links[cur].click();
});
point(0);
</script>
</body>
</html>
